services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

  api:
    image: ${DOCKERHUB_USERNAME}/ams-api:latest
    container_name: ams-api
    restart: unless-stopped
    # Not published on the host; Caddy reverse-proxies to api:8080 over the frontend network.
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      RunMigrationsAtStartup: "true"
      # Served at /scalar/v1 and /openapi/v1.json; only safe to enable because Caddy puts Basic Auth
      # in front of those paths (see Caddyfile.example) - the app itself has no browser-page login.
      EnableScalarDocs: "true"
      ApplicationSettings__DbConnectionString: ${DB_CONNECTION_STRING}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      # Creates the first owner/Admin account on startup if Bootstrap:OwnerEmail has no row yet.
      # Does nothing once any Admin exists - safe to leave set after the first successful login.
      Bootstrap__OwnerPassword: ${BOOTSTRAP_OWNER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend

  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env)}
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only, never reachable from the internet: connect with an SSH tunnel (DataGrip: SSH/SSL tab,
    # host localhost, port 5432). Keep the 127.0.0.1 prefix; Docker publishing ignores the ufw firewall.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
